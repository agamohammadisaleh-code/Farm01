name: Platform CI

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت بسته دامنه
        run: npm run build:domain

      - name: بررسی نوع‌ها
        run: npm run typecheck

      - name: بررسی نوع‌های اپ موبایل
        run: npm run typecheck:mobile

      - name: تست دامنه، API و وب
        run: npm test

      - name: ساخت داشبورد وب
        run: npm run build:web

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/services/ai/requirements.txt

      - name: نصب وابستگی‌ها
        run: pip install -r requirements.txt

      - name: تست سرویس تحلیل
        run: python -m pytest -q
