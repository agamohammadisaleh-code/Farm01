name: Platform CI

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "platform/**"

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت بسته دامنه
        run: npm run build:domain

      - name: بررسی نوع‌ها
        run: npm run typecheck

      - name: تست دامنه و API
        run: npm test
