name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: بررسی نوع‌ها
        run: npx tsc --noEmit

      - name: اجرای تست‌ها
        run: npm test

      - name: ساخت نسخه تولید
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
